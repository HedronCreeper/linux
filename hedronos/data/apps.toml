# HedronOS curated application catalog
# SPDX-License-Identifier: MIT
#
# Read by the pre-install picker (`hedron-firstsetup`) and by Hedron Store after install.
# `locked = true` means the installer shows it ticked and greyed out — that is how Steam
# is guaranteed present on every gaming profile without forcing it on `core`.
#
# Rules enforced by tools/hedronos-verify (see catalog.validate()):
#   id is kebab-case · summary < 120 chars · category exists below · positive size_mib
#   at least one provider · reverse-DNS flatpak id · requires/conflicts point at real ids

[meta]
version = 7
updated = "2026-11-07"
default_repo = "extra"
# Anything not listed here is fetched from Flathub; the store marks it "community".
default_remote = "flathub"

# ------------------------------------------------------------------------ categories
[[category]]
id = "gaming"
name = "Gaming & launchers"
icon = "input-gaming"
blurb = "Stores, launchers, mods, overlays. Steam is pre-selected on every gaming profile."

