# --------------------------------------------------------------------------- bundles
[bundles.gaming-essentials]
name = "Gaming essentials"
blurb = "Everything to play what you own, today"
apps = ["steam", "heroic", "lutris", "mangohud-ui", "protonplus", "gamemode-ui", "obs", "discord", "vlc", "keeper"]

[bundles.everyday]
name = "Everyday desktop"
blurb = "Browser, mail, office, media, chat"
