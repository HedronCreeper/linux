apps = ["term-fancy", "htop", "syncthing"]

# ------------------------------------------------------------------------------ apps
# ---- gaming ------------------------------------------------------------ locked first
[[app]]
id = "steam"
name = "Steam"
category = "gaming"
summary = "Valve's store, Proton, Big Picture and the Steam Runtime — installed with the native runtime too"
description = "HedronOS treats Steam as a system component rather than an app: the Proton runtime, the native runtime libraries, the udev rules for controllers, and the GameMode hooks are installed together, and the launch options get `hedron-run` injected so FlowState engages on the first frame. Instant Replay and the in-game overlay bind to it automatically."
locked = true
gaming = true
tier = "verified"
size_mib = 1250
pacman = ["steam", "steam-native-runtime", "lib32-mesa", "vulkan-radeon", "gamemode", "game-devices-udev"]
profiles = ["gamerte", "handheld", "desktop", "studio"]
post_install = ["hedron-tune lock --profile gaming", "hgm status"]
sandbox = "none"
icon = "steam"
notes = "Proton-GE and Wine-GE are offered by Hedron Store as separate downloads; we never patch your prefix."

