# HedronOS profile: core — no desktop: the driver and tuning layer only, for VMs and custom compositors.
# key = value, read by imgbuild/lib/common.sh (common_init exports every line as
# HEDRON_P_<key>). Stages must not contain a `case "$PROFILE"`: a profile is data, so
# all the differences between editions live here.
# SPDX-License-Identifier: MIT
name = 
title = HedronOS Core
blurb = no desktop: the driver and tuning layer only, for VMs and custom compositors
package_set = core
variant_default = net
desktop = none
display_manager = none
session_package = hedronos-session
autologin = false
kernel_flavour = hedron
gpu_mode = auto
precache_drivers = true
include_gamescope = false
overlay_preset = 
tune_profile = server
gamemode_default = on
replay_default = off
first_setup = none
store_auto_select = 
extra_packages = 
live_hostname = hedronos-core
iso_suffix = -core
release_notes = false
