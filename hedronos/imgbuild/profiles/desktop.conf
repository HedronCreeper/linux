# HedronOS profile: desktop — the everyday machine that also plays games.
# key = value, read by imgbuild/lib/common.sh (common_init exports every line as
# HEDRON_P_<key>). Stages must not contain a `case "$PROFILE"`: a profile is data, so
# all the differences between editions live here.
# SPDX-License-Identifier: MIT
name = 
title = HedronOS Desktop
blurb = the everyday machine that also plays games
package_set = desktop
variant_default = dvd
desktop = kde-wayland
display_manager = sddm
session_package = hedronos-session
autologin = false
kernel_flavour = hedron
gpu_mode = auto
precache_drivers = true
include_gamescope = false
overlay_preset = minimal
tune_profile = desktop
gamemode_default = on
replay_default = off
first_setup = chooser
store_auto_select = steam
extra_packages = libreoffice-fresh thunderbird
live_hostname = hedronos-desktop
iso_suffix = 
release_notes = true
