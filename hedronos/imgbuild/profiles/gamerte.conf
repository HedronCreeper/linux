# HedronOS profile: gamerte — gaming edition: every gaming package selected, drivers preseeded, HUD on.
# key = value, read by imgbuild/lib/common.sh (common_init exports every line as
# HEDRON_P_<key>). Stages must not contain a `case "$PROFILE"`: a profile is data, so
# all the differences between editions live here.
# SPDX-License-Identifier: MIT
name = 
title = HedronOS GamerTE
blurb = gaming edition: every gaming package selected, drivers preseeded, HUD on
package_set = gamerte
variant_default = dvd
desktop = kde-wayland
display_manager = sddm
session_package = hedronos-session
autologin = false
kernel_flavour = hedron
gpu_mode = auto
precache_drivers = true
include_gamescope = false
overlay_preset = competitive
tune_profile = performance
gamemode_default = on
replay_default = on
first_setup = chooser
store_auto_select = steam
extra_packages = steam-native-runtime gamemode mangohud
live_hostname = hedronos-gamer
iso_suffix = 
release_notes = true
