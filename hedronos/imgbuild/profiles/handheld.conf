# HedronOS profile: handheld — Deck-class hardware: gamescope session, TDP modes, quiet by default.
# key = value, read by imgbuild/lib/common.sh (common_init exports every line as
# HEDRON_P_<key>). Stages must not contain a `case "$PROFILE"`: a profile is data, so
# all the differences between editions live here.
# SPDX-License-Identifier: MIT
name = 
title = HedronOS Handheld
blurb = Deck-class hardware: gamescope session, TDP modes, quiet by default
package_set = handheld
variant_default = net
desktop = gamescope
display_manager = none
session_package = hedronos-session
autologin = true
kernel_flavour = hedron
gpu_mode = auto
precache_drivers = true
include_gamescope = true
overlay_preset = handheld
tune_profile = battery
gamemode_default = on
replay_default = on
first_setup = minimal
store_auto_select = steam
extra_packages = gamescope mangohud
live_hostname = hedronos-handheld
iso_suffix = -handheld
release_notes = true
