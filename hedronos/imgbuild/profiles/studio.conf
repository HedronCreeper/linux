# HedronOS profile: studio — capture, edit, and still game on the same box.
# key = value, read by imgbuild/lib/common.sh (common_init exports every line as
# HEDRON_P_<key>). Stages must not contain a `case "$PROFILE"`: a profile is data, so
# all the differences between editions live here.
# SPDX-License-Identifier: MIT
name = 
title = HedronOS Studio
blurb = capture, edit, and still game on the same box
package_set = studio
variant_default = dvd
desktop = kde-wayland
display_manager = sddm
session_package = hedronos-session
autologin = false
kernel_flavour = hedron
gpu_mode = auto
precache_drivers = true
include_gamescope = false
overlay_preset = streamer
tune_profile = studio
gamemode_default = on
replay_default = on
first_setup = chooser
store_auto_select = steam
extra_packages = pipewire-jack dav1g
live_hostname = hedronos-studio
iso_suffix = 
release_notes = true
