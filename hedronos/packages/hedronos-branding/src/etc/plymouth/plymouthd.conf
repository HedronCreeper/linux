[Daemon]
Theme=hedronos
ShowDelay=0
# Boot messages stay on the splash instead of scrolling past on tty1 — the reason people press
# Esc at boot is that they cannot see what went wrong afterwards.
ShowTheme=yes
# Boot-time latency is what we sell: no framebuffer flicker between initrd and root.
DeviceScale=1
