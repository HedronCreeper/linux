<?xml version="1.0" encoding="UTF-8"?>
<!-- HedronOS wallpaper "terminus". Vector, CC0-1.0, generated from the same geometry as duality
     with a different palette and rotation so the four are family, not four random pictures. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#0a0608"/><stop offset="0.5" stop-color="#1c0f14"/>
      <stop offset="0.8" stop-color="#3a1c22"/><stop offset="1" stop-color="#6b2f33"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8564f"/><stop offset="1" stop-color="#ffb28c"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="3840" height="2160" fill="url(#bg)"/>
  <g transform="translate(1920 1080) rotate(16)" fill="none" stroke="url(#edge)" stroke-width="3" filter="url(#soft)">
    <path d="M-560 380 L0 -700 L560 380 Z"/>
    <path d="M-560 380 L0 118 L560 380 M0 -700 L0 118"/>
    <path d="M-560 -380 L0 700 L560 -380 Z" stroke-opacity="0.7"/>
    <path d="M-560 -380 L0 -118 L560 -380 M0 700 L0 -118" stroke-opacity="0.7"/>
    <circle r="980" stroke-opacity="0.16"/>
    <circle r="1120" stroke-opacity="0.07"/>
  </g>
</svg>
