# Instant replay configuration — read by hedron-replayd and hedron-replay.
# SPDX-License-Identifier: MIT
[replay]
# Master switch. When false the daemon exits immediately and the shortcut does nothing.
enabled = true

# How much history to keep. 60 s covers "the whole fight"; 30 s is half the disk.
seconds = 60

# Segment length. Shorter = faster pruning and less to lose on a crash, but more inodes.
segment_seconds = 10

fps = 60
resolution = "desktop"

# auto probes nvenc → amf → vaapi and refuses to fall back to x264 (software encoding a
# 1440p120 ring steals the cores your game needs; we would rather record nothing).
encoder = "auto"
bitrate_kbps = 25000
preset = "low-latency"
audio = true
audio_source = "default"

# Hard ceiling on the ring. The daemon prunes oldest-first and never rewrites a closed file.
max_disk_mib = 4096

# Only spin up the encoder while a game holds a claim (hgm) — otherwise a desktop session
# burns a GPU encoder context for nothing.
only_on_claim = true

# Where `hedron-replay save` writes.
output_dir = "~/Videos/HedronOS"

# The compositor-side shortcut (bound by hedronos-session's KWin script / gamescope overlay).
save_shortcut = "SUPER+ALT+S"
