# What `hedron-doctor scan` looks at, and how loud it is.  SPDX-License-Identifier: MIT
#
# The list exists so the docs and the binary cannot drift: hedronos-verify checks that every id
# below is documented, and `hedron-doctor scan --list` prints it.
[doctor]
# error = shown always, warn = shown, info = only with -v
min_severity = warn
save_last_scan = /var/lib/hedron/doctor/last-scan.json
keep_scans = 8
# Fixing without asking is never the distro's decision to make.
auto_fix = false

[checks]
kernel = true
gpu = true
dmesg = true
initramfs = true
units = true
tuning = true
store = true
bootloader = true
desktop = true
disk = true
power = true

[report]
# Everything the tarball may contain. Nothing under $HOME is ever read, and `credentials=` in
# mount lines is masked on the way in (not on the way out — the file on disk never has it).
include = cmdline, uname, os-release, mounts, dmesg-tail, systemd-units, pci, doctor.json, etc-hedron
mask = credentials=***
