# HedronOS graphics stack behaviour — read by hedron-drivers and driverd.
# Everything here is optional; the defaults are what we ship and support.
# SPDX-License-Identifier: MIT

# Run the convergence pass on every boot (detect a swapped GPU, a kernel update that
# invalidated DKMS, a package that blacklisted the vendor module).
converge_on_boot = true

# Re-plan when a display device is hotplugged (eGPU docks).
hotplug_replan = true

# Seconds the socket-activated planner stays alive with no client.
idle_timeout_s = 60

# Use the driver cache baked into the ISO (/var/cache/hedron/drivers) instead of the
# network. The installer sets this automatically; flip it on later if you are offline.
prefer_offline = auto

# NVIDIA: request the open kernel module when the GPU supports it (Turing and newer).
# Set to `false` to force the proprietary branch, or `auto` (default) to decide per GPU.
prefer_open_module = auto

# Suspend handling: install the sleep scripts + nvidia-{suspend,resume} units.
fix_suspend = true

# Secure Boot: when on, sign DKMS results with our MOK instead of failing silently.
mok_auto_enroll = ask

# Keep the in-kernel driver available as a fallback path even when the vendor module is
# installed. Costs nothing and saves a session when the vendor update breaks.
keep_nouveau_fallback = true

# Refuse to touch these files/packages, comma separated, e.g. "nvidia-settings,corectrl".
hands_off =

# Extra kernel parameters appended to every plan (advanced).
extra_cmdline =
