# HedronOS game claims — read by hgm and hedron-run. SPDX-License-Identifier: MIT

# Programs that are always worth a claim when they are the focused window, so you do not
# have to edit every launcher. Match is a substring of the process name.
auto_claim = steam.exe, wine64-preloader, gamescope, rtlup.exe

# Anti-cheat launchers that break if we touch their process priority or CPU affinity.
# Listing them here costs nothing; not listing them can cost a ban, so the deny list wins
# over auto_claim and over `hedron-run --wrap`.
deny = easeapp.exe, bgsvc.exe, faceit.exe, r5apex.exe, vgcpu-bootstrapper.exe,
       epicwebhelper.exe

# What a claim does, in order. Anything false is skipped (so you can keep the cgroup part
# and drop the sysctl part if you prefer FlowState to be purely manual).
[claim]
flowstate = true          # engage the gaming profile via hedronflowd
scheduler = true          # ask scx_hedron to boost the claiming thread
nice = -1                 # mild niceness for the game process group
oom_score_adj = -500      # a kernel OOM walk should take Chrome before your game
replay = true             # tell hedron-replayd to keep a full-rate ring buffer

[daemon]
idle_exit_s = 600
max_claims = 64
verbose = false
