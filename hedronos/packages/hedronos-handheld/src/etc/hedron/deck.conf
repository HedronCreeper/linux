# Handheld session: what `hedron-deck-session` launches.  SPDX-License-Identifier: MIT
#
# Flags are passed to gamescope *verbatim* — but only after the launcher checks each one against
# `gamescope --help` on this machine, because gamescope's flags change between the builds Valve
# ships and the ones distros package. An unknown flag is dropped with a warning instead of
# killing your session.
[session]
compositor = gamescope
runner = steam
args = -W 1280 -H 800 -f -e -F linear --prefer-vk-device
width = 1280
height = 800
orientation = 0

[steam]
# Big Picture from the desktop session: the client already knows how to render for a 7-inch
# panel; we just have to not get in its way.
args = -tenzone steamos -silent -vgui
bigpicture = true

[input]
# Handheld-only buttons, mapped to distro actions (see 99-hedron-handheld.hwdb for keycodes).
guide = hedron-overlay toggle
qam = hedron-handheld status --json

[hud]
# The overlay every handheld wants: FPS + battery + frame time, no setup.
enable = true
mangohud_args = --toggle-key F10 --position tl

[hdr]
# Handheld panels that can do HDR need explicit output-mode negotiation; off by default.
enable = false
