# Desktop-session environment for KDE on HedronOS.  SPDX-License-Identifier: MIT
#
# Per-GPU variables are written by hedron-drivers into /etc/environment.d/60-hedron-graphics.conf;
# this file only contains the compositor-agnostic Qt/KDE choices. systemd applies these in
# lexicographic order, so the graphics file (60) loses to this one (99) only for the keys listed
# here — which is exactly the two we want to win.
QT_QPA_PLATFORM=wayland;xcb
QT_WAYLAND_RECONNECT=1
GDK_BACKEND=wayland,x11
SDL_VIDEODRIVER=wayland,x11
QT_AUTO_SCREEN_SCALE_FACTOR=0
QT_ENABLE_HIGHDPI=scaling
QT_SCALE_FACTOR_ROUNDING_POLICY=PassThrough
KWIN_DISABLE_DEPRECATED_EFFECTS=1
