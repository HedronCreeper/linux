# HedronOS SDDM theme. SPDX-License-Identifier: MIT
[General]
description=HedronOS greeter: one user, one session picker, your wallpaper, no clutter
mainfont=Inter
type=org.kde.sddm
desktopfile=plasma.desktop
background=/usr/share/hedron/wallpapers/duality.svg
transitions=false
prompt=Sign in
# The panel that shows the GPU driver and the pending-reboot flag — the two things you actually
# want to know before you type a password on a machine you just updated.
showDriverInfo=true
