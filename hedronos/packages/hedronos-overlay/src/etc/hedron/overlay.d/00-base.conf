# Shared defaults merged under every preset.  SPDX-License-Identifier: MIT
#
# `hedron-overlay show` prints this file first and then the preset, which is why presets stay
# short: they only say what differs. The loader (`hedronos-session` for gamescope, MangoHud
# for everything else) applies the same order.
version=1
output_folder=~/Videos/HedronOS/overlay
persist_vsync=1
vsync=0
tearing=0
font_size=20
font_file=
font_color=FFFFFF
font_outline_color=000000
background_color=020202
background_alpha=0.60
foreground_alpha=1.0
x_offset=16
y_offset=16
table_columns=2
border_size=1
round_corners=8
gpu_stats=1
gpu_temp=1
gpu_temp_unit=C
vram=1
ram=1
cpu_stats=1
cpu_temp=1
cpu_speed=1
core_load=0
io_stats=1
power_usage=1
battery=0
winesync=1
arch=1
gpu_name=1
cpu_brand=1
time=%H:%M:%S
fps=1
frame_timing=1
frametime_limit=50
throttling_status=1
vulkan=1
prologue=
epilogue=
exec=
media_engine=1
volatility=0
legacy_vsync=0
network=0
log_interval=0
track_frametime=1
hud_no_display=0
mangoapp=0
