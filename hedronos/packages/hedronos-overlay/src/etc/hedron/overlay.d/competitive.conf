# HedronOS overlay preset: competitive — small, top-left, no decoration, frametime first.
# SPDX-License-Identifier: MIT
# Format: MangoHud's key=value, because that is what the gamescope/KWin loaders read.
# `hedron-overlay edit competitive` opens this file; `hedron-overlay new myname` copies it.
position=top-left
font_size=18
font_outline=1
background_alpha=0.30
vsync=1
frame_timing=1
frametime_history=1
frametime_count=120
engine_font=DejaVu Sans
custom_text=HedronOS
gpu_stats=1
gpu_temp=1
gpu_text=GPU
cpu_stats=1
cpu_temp=1
core_load=0
vram=1
ram=0
media_engine=0
volatility=1
time=0
battery=0
winesync=0
arch=0
legacy_vsync=0
threshold_swapping=1
toggle_hud=Shift_L+Ctrl_L+H
toggle_preset=Shift_L+Ctrl_L+P
