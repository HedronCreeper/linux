# HedronOS runtime state directories. Created here (not in %post) so that a package
# upgrade, a fresh install and a chroot-build all produce the same tree.
# SPDX-License-Identifier: MIT
d /run/hedron 0755 root root -
d /run/hedron/store 0755 root root -
d /var/lib/hedron 0755 root root -
d /var/lib/hedron/drivers 0755 root root -
d /var/lib/hedron/store 0755 root root -
d /var/lib/hedron/rollback 0700 root root -
f /var/lib/hedron/rollback/enable 0644 root root -
d /var/cache/hedron 0755 root root -
d /var/cache/hedron/drivers 0755 root root -
d /var/cache/hedron/store 0755 root root -
d /etc/hedron 0755 root root -
d /etc/hedron/flowstate.d 0755 root root -
d /etc/hedron/flowstate.d/user 0755 root root -
q /var/log/hedron 2750 root systemd-journal -
