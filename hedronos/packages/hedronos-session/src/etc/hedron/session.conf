# Session behaviour — read by hedron-session and the shipped compositor scripts.
# SPDX-License-Identifier: MIT

# Publish focus changes so FlowState can engage the gaming profile. Requires the KWin script
# (hedronos-vitals) or the gamescope hook; harmless if neither is present.
bridge = true

# What "fullscreen" means for engagement: only exclusive-fullscreen windows, or any
# maximised game window too. The strict default avoids "my browser is using performance mode".
engage_on = fullscreen

# Offer the HDR pipeline only when a connected output advertises metadata support.
hdr = auto

# The compositor-side overlay (frame times). false disables drawing even if the HUD preset
# is active — useful when recording without a HUD but with the replay ring running.
compositor_overlay = true

# Start the deck (gamescope) session automatically when a handheld chassis is detected.
deck_autostart = auto
