# The HedronOS package repository, included from /etc/pacman.conf.
# Include lines cannot be conditional, so this file exists to be dropped in — the installer
# writes /etc/pacman.d/hedron-os-mirror with the chosen Server= line (hedronos-install).
# SPDX-License-Identifier: MIT
[hedron-os]
SigLevel = Required DatabaseOptional
Include = /etc/pacman.d/hedron-os-mirror
