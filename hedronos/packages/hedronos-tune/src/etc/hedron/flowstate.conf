# HedronOS FlowState behaviour — read by hedronflowd. SPDX-License-Identifier: MIT
# Copy to /etc/hedron/flowstate.local.toml (TOML, [flow] section) for overrides that
# survive upgrades; this file is a simple key=value list on purpose so it is greppable.

# Master switch. false = the daemon evaluates and logs but never changes anything.
enabled = true

# Engage the gaming profile automatically when a game takes the screen.
auto_gaming = true

# Switch to battery/silence profiles on power and thermal events.
auto_power = true
auto_thermal = true

# Which signals count as "a game is running": gamemode (hgm), fullscreen focus, hedron-run.
engage_on = gamemode, fullscreen, hedron-run

# Profile names, resolved against /etc/hedron/flowstate.d/*.toml
profile_gaming = gaming
profile_desktop = balanced
profile_battery = battery
profile_thermal = silence

# Seconds to keep the gaming profile after the game disappears (alt-tab to Discord,
# load screens, a quick desktop peek). Too short and you pay a profile switch mid-session.
release_delay_s = 12

# Package/edge temperature that triggers the silence profile.
thermal_temp_c = 88

# Do not drop out of gaming while hedron-replayd is writing a clip.
hold_while_recording = true

# Poll interval for the autonomous rules (the socket bridge is event-driven, so this only
# costs a /sys read and a `hgm status`).
poll_s = 2.0
