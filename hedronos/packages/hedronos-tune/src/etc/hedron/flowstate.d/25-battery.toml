# FlowState: battery — laptops unplugged.  SPDX-License-Identifier: MIT
[profile]
name = "battery"
inherits = "balanced"
note = "Deep idle states on, GPU downclocked, writeback batched. Not for gaming."

[cpu]
governor = "powersave"
energy_performance_preference = "power"
boost = false
disable_idle_states = []

[sysctl]
"vm.dirty_expire_centisecs" = 3000
"vm.dirty_writeback_centisecs" = 1500
"net.core.busy_poll" = 0
"net.core.busy_read" = 0
"vm.laptop_mode" = 5
"kernel.nmi_watchdog" = 0

[sysfs]
"sys/devices/system/cpu/cpu*/cpuidle/state1/disable" = "0"
"sys/devices/system/cpu/cpu*/cpuidle/state2/disable" = "0"
"sys/devices/system/cpu/cpu*/cpuidle/state3/disable" = "0"
"sys/class/backlight/*/brightness" = "auto"

[gpu]
power_profile = "battery"
"power_dpm_force_performance_level" = "auto"

[sched]
scheduler = "none"

[services]
enable = ["power-profiles-daemon.service"]

[extra]
hint = { mode = "skip", command = "hedron-tune: gaming is deliberately unavailable while on battery unless HEDRON_FORCE=1" }
