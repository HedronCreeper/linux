# HedronOS: let the user's own session manager own the game slice. Without delegation a
# per-game `systemd-run --user --slice=hedron-game.slice` silently puts the process in the
# user slice instead — which is worse than doing nothing, because the launcher believes it
# worked.
# SPDX-License-Identifier: MIT
[Service]
Delegate=cpuset cpu io memory pids
ManagedOOMSwap=kill
ManagedOOMMemoryPressure=keep
