Modules every HedronOS session expects, loaded at boot rather than "when something asks".
#
# The graphics drivers themselves are NOT here: hedron-drivers writes
# /etc/modules-load.d/hedron-gpu.conf per detected GPU, which is how the same image boots on
# three vendors. What is listed here is the stuff the *distro tooling* assumes exists.
