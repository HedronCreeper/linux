# HedronOS kernel tuning that belongs in sysctl (the rest lives in hedron-tune's profiles, which
# are per-session and reversible — this file is the "always true" half).
# SPDX-License-Identifier: MIT

# Unprivileged user namespace creation: Proton/Wine sandboxes and Flatpak both need it, and the
# kernel default (disabled on many distros) is why "Steam runs but the runtime fails" exists.
user.max_user_namespaces = 28007

# A game that stalls 20 s writing its shader cache should not stall your desktop with it.
vm.dirty_expire_centisecs = 500
vm.dirty_writeback_centisecs = 250
vm.dirty_ratio = 20
vm.dirty_background_ratio = 3

# Swapping out a game's pages is the number-one "why did my FPS halve" cause after an hour of play.
vm.swappiness = 10
vm.vfs_cache_pressure = 50
# zswap is on in the kernel config; page-cluster 0 keeps the readahead from eating a SATA link.
vm.page-cluster = 0

# Shared-memory heavy launchers and Proton prefixes.
kernel.shm_rmid_forced = 1
fs.inotify.max_user_watches = 1048576
fs.inotify.max_user_instances = 1024
fs.file-max = 1048576

# BBR + the socket buffers a 1 Gb/s connection with 10 ms RTT actually needs.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 131072 16777216
net.ipv4.tcp_wmem = 4096 131072 16777216
net.core.netdev_max_backlog = 30000
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_notsent_lowat = 16384
net.core.default_qdisc = fq

# Kernel messages to the console cost you a frame; kmsg rate limits stop a driver yelling.
kernel.printk = 4 1 3 7
dev.tty.ldisc_autoload = 0
kernel.kptr_restrict = 1
kernel.unprivileged_bpf_disabled = 0
net.core.bpf_jit_harden = 2
